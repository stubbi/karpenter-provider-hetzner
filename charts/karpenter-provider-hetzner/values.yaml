# nameOverride replaces the chart name used to build resource names and the
# app.kubernetes.io/name label. fullnameOverride replaces the generated resource
# name outright -- set it to "karpenter-provider-hetzner" to keep the names used
# by chart releases before 3.0.0 if your release is not named that already.
nameOverride: ""
fullnameOverride: ""

replicas: 1

image:
  repository: ghcr.io/stubbi/karpenter-provider-hetzner
  # Empty tracks the chart's appVersion, which the release workflow sets from
  # the git tag and publishes as a matching image tag. Pinning "latest" here
  # meant a released chart floated onto whatever was newest.
  tag: ""
  pullPolicy: IfNotPresent

auth:
  secretRef:
    name: hcloud-token
    key: token

hcloud:
  # apiTimeout bounds a single hcloud HTTP request (Go duration, max 5m). It is
  # per request, not per operation: the SDK polls actions in a loop of separate
  # requests, so a server create that legitimately takes minutes is many short
  # requests. Without it a blackholed connection to api.hetzner.cloud parks a
  # controller worker forever. Raise it only if you see timeouts against a
  # healthy API.
  apiTimeout: 30s

serviceAccount:
  create: true
  # Empty means the release-scoped generated name. Before 3.0.0 this defaulted to
  # "karpenter", which is also what the upstream karpenter chart creates -- so the
  # two charts in one namespace silently shared a ServiceAccount and one
  # release's uninstall revoked the other's access. Set it explicitly to bind to
  # a ServiceAccount you manage yourself (with create: false).
  name: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Pod scheduling & placement. All empty by default — opt in via values.
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
imagePullSecrets: []
priorityClassName: ""

# PodDisruptionBudget for voluntary-disruption safety (e.g. node drains). Enable
# when running replicas > 1. Set minAvailable OR maxUnavailable (integers only,
# mutually exclusive — no percentages); leave both unset to default to
# maxUnavailable: 1, which never blocks drains (a single replica can still be
# evicted — run replicas >= 2 to keep the controller available).
podDisruptionBudget:
  enabled: false
  # minAvailable: 1   # must be < replicas (so needs replicas >= 2)
  # maxUnavailable: 1

# Container launch overrides. `args` passes flags to the controller (e.g.
# --log-level, --feature-gates); `command` replaces the entrypoint binary (rarely
# needed — the hardcoded probes expect /healthz and /readyz).
command: []
args: []

# Required: scopes managed servers so multiple clusters can share one Hetzner project.
clusterName: ""

metrics:
  port: 8080
healthProbe:
  port: 8081

# serviceMonitor wires a Prometheus Operator ServiceMonitor to the metrics port.
# Requires the prometheus.io/operator CRD to be installed in the cluster.
serviceMonitor:
  # enabled: set true to deploy the Service + ServiceMonitor resources.
  enabled: false
  # interval: how often Prometheus scrapes the metrics endpoint.
  interval: 30s
  # additionalLabels: extra labels to add to the ServiceMonitor (e.g. for a
  # Prometheus Operator instance selector).
  additionalLabels: {}
