{{- if not .Values.clusterName }}
{{- fail "clusterName is required: set --set clusterName=<your-cluster>" }}
{{- end }}
{{- include "karpenter-hetzner.requireInt" (dict "value" .Values.replicas "name" "replicas" "allowZero" true) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karpenter-hetzner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karpenter-hetzner.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas | int }}
  selector:
    matchLabels:
      {{- include "karpenter-hetzner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "karpenter-hetzner.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "karpenter-hetzner.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: HCLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretRef.name }}
                  key: {{ .Values.auth.secretRef.key }}
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: HCLOUD_API_TIMEOUT
              value: {{ .Values.hcloud.apiTimeout | quote }}
            - name: ORPHAN_GC_ENABLED
              value: {{ .Values.orphanGC.enabled | quote }}
            - name: ORPHAN_GC_GRACE_PERIOD
              value: {{ .Values.orphanGC.gracePeriod | quote }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: HEALTH_PROBE_PORT
              value: {{ .Values.healthProbe.port | quote }}
          ports:
            - name: http-metrics
              containerPort: {{ .Values.metrics.port }}
            - name: http-health
              containerPort: {{ .Values.healthProbe.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-health
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
