apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "karpenter-hetzner.clusterRoleName" . }}
  labels:
    {{- include "karpenter-hetzner.labels" . | nindent 4 }}
rules:
  # Karpenter core CRDs.
  - apiGroups: ["karpenter.sh"]
    resources: ["nodeclaims", "nodeclaims/status", "nodepools", "nodepools/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Owner references with blockOwnerDeletion, needed when the
  # OwnerReferencesPermissionEnforcement admission plugin is enabled.
  - apiGroups: ["karpenter.sh"]
    resources: ["nodeclaims/finalizers", "nodepools/finalizers"]
    verbs: ["create", "update", "patch", "delete"]
  # NodeOverlay (feature gate NodeOverlay).
  - apiGroups: ["karpenter.sh"]
    resources: ["nodeoverlays", "nodeoverlays/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["karpenter.sh"]
    resources: ["nodeoverlays/status"]
    verbs: ["update", "patch"]
  # CapacityBuffer (feature gate CapacityBuffer) and the pod templates it references.
  - apiGroups: ["autoscaling.x-k8s.io"]
    resources: ["capacitybuffers", "capacitybuffers/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling.x-k8s.io"]
    resources: ["capacitybuffers/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["podtemplates"]
    verbs: ["get", "list", "watch"]
  # Provider node class.
  - apiGroups: ["karpenter.hetzner.cloud"]
    resources: ["hcloudnodeclasses", "hcloudnodeclasses/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Nodes: observe + manage (label/taint/drain/terminate during disruption).
  - apiGroups: [""]
    resources: ["nodes", "nodes/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Core resources Karpenter's scheduling simulation observes.
  - apiGroups: [""]
    resources: ["pods", "persistentvolumes", "persistentvolumeclaims", "replicationcontrollers", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # Force-delete pods once a node's terminationGracePeriod expires
  # (NodePool terminationGracePeriod, NodeRepair).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  # Workload controllers (pod ownership + scheduling simulation).
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  # Storage: volume-aware scheduling and disruption.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  # CRD readiness check (operator /readyz verifies its CRDs are established).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # Leader election.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "karpenter-hetzner.clusterRoleName" . }}
  labels:
    {{- include "karpenter-hetzner.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "karpenter-hetzner.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "karpenter-hetzner.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
