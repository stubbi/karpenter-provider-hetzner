---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: hcloudnodeclasses.karpenter.hetzner.cloud
spec:
  group: karpenter.hetzner.cloud
  names:
    categories:
    - karpenter
    kind: HCloudNodeClass
    listKind: HCloudNodeClassList
    plural: hcloudnodeclasses
    shortNames:
    - hcnc
    singular: hcloudnodeclass
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              bootstrap:
                description: |-
                  Bootstrap makes the provider render the node's join configuration for a
                  k3s or RKE2 agent, instead of the operator hand-writing it in userData. The
                  provider renders the join config (server, token from a Secret, the
                  karpenter.sh/unregistered:NoExecute taint, kubelet-arg for the reservations
                  in spec.kubelet) and the install command, so the registration contract and
                  the advertised allocatable cannot drift from what the node runs.

                  userData or userDataSecretRef, when set alongside it, must be a
                  #cloud-config document and is merged into the rendered one: list keys are
                  combined with the provider's entries first, and a key or file path the
                  provider owns is an error rather than silently overridden.

                  Opt-in: without it, userData is passed through unchanged as before. Not
                  supported with imageSelector.family talos.
                properties:
                  distribution:
                    description: 'Distribution is the agent to install: k3s or rke2.'
                    enum:
                    - k3s
                    - rke2
                    type: string
                  extraConfig:
                    description: |-
                      ExtraConfig is a YAML mapping merged into the rendered agent config file
                      (/etc/rancher/k3s/config.yaml or /etc/rancher/rke2/config.yaml), e.g.
                      "node-ip: ..." or "flannel-iface: enp7s0". server and token are owned by
                      the provider and rejected here; node-taint, node-label and kubelet-arg
                      entries are appended to the provider's, except ones that would replace a
                      provider-owned flag or the karpenter.sh/unregistered taint.
                    maxLength: 16384
                    type: string
                  server:
                    description: |-
                      Server is the URL agents join, e.g. https://10.0.0.2:6443 for k3s or
                      https://10.0.0.2:9345 for RKE2.
                    maxLength: 2048
                    pattern: ^https://[^\s/?#]+(/[^\s]*)?$
                    type: string
                  tokenSecretRef:
                    description: |-
                      TokenSecretRef names the Secret key holding the join token. It is always
                      read from the namespace the provider runs in, never another one. Use an
                      agent token (k3s --agent-token), not the server token: the rendered
                      userData is readable from the Hetzner metadata service on every node.
                    properties:
                      key:
                        description: Key within the Secret's data holding the join
                          token.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  version:
                    description: |-
                      Version pins the agent release (INSTALL_K3S_VERSION /
                      INSTALL_RKE2_VERSION), e.g. v1.31.5+k3s1. When omitted the installer's
                      stable channel is used; pin it to match your servers.
                    maxLength: 64
                    pattern: ^v[0-9A-Za-z.+_-]+$
                    type: string
                required:
                - distribution
                - server
                - tokenSecretRef
                type: object
              enablePublicIPv4:
                default: true
                description: |-
                  EnablePublicIPv4 controls whether created servers get a public IPv4.
                  Defaults to true (Hetzner's default). Set false on private-network
                  clusters to avoid the primary-IPv4 charge.
                type: boolean
              enablePublicIPv6:
                default: true
                description: |-
                  EnablePublicIPv6 controls whether created servers get a public IPv6.
                  Defaults to true. Set false to drop the public IPv6 as well.
                type: boolean
              firewallIDs:
                items:
                  format: int64
                  type: integer
                type: array
              imageSelector:
                properties:
                  family:
                    enum:
                    - talos
                    - ubuntu
                    type: string
                  selector:
                    additionalProperties:
                      type: string
                    description: |-
                      Selector is an hcloud label selector applied when listing images, e.g.
                      {"caph-image-name": "talos-v1.13.3-gvisor"}. Use it to pin the exact image
                      (version plus baked extensions) instead of fuzzy description matching. Like
                      Version, setting it enables image drift.
                    type: object
                  version:
                    description: |-
                      Version is matched against the image description. Setting it (or Selector)
                      pins the image: nodes drift, and are replaced, when the pinned selector
                      resolves to a different image than the one they were launched from. A selector
                      with neither set resolves to the newest matching image and never causes image
                      drift, so a snapshot upload cannot roll the fleet.
                    type: string
                required:
                - family
                type: object
              kubelet:
                description: |-
                  Kubelet declares the reservations this node class's bootstrap applies to
                  the kubelet, so Karpenter can subtract them when computing how much of a
                  server a pod can actually use.

                  This provider does not render the bootstrap: userData is supplied by the
                  operator, so these values describe what that userData does rather than
                  configure it. They must be kept in agreement with it. Declaring less than
                  the bootstrap reserves makes Karpenter believe a server is larger than it
                  is, which strands pods on nodes too small for them.

                  When omitted, a flat 100m CPU / 100Mi memory kubeReserved is assumed.

                  With spec.bootstrap set, the provider does render the bootstrap: these
                  values are written into the kubelet flags, so they become prescriptive and
                  an empty or absent block means the kubelet's own defaults rather than the
                  flat 100m/100Mi above.
                properties:
                  evictionHard:
                    additionalProperties:
                      description: |-
                        EvictionThreshold is a hard eviction threshold: a non-negative quantity such as
                        "400Mi", or a percentage of capacity such as "10%". The kubelet flag syntax
                        ("memory.available<400Mi") is not accepted; give the value alone.
                      maxLength: 32
                      pattern: ^(([0-9]{1,2}([.][0-9]*)?|[.][0-9]+|100([.]0*)?)%|[+]?(([0-9]+([.][0-9]*)?)|([.][0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE]([+]|-)?[0-9]{1,3}))?)$
                      type: string
                    description: |-
                      EvictionHard is the kubelet's hard eviction thresholds. Memory held back
                      for eviction is memory a pod cannot have, so it comes out of allocatable
                      the same way a reservation does. Values are either a quantity ("400Mi") or
                      a percentage of capacity ("10%"). A signal left out is assumed at the
                      kubelet default (memory.available=100Mi, nodefs.available=10%), which errs
                      toward underselling the node; declare "0%" (the kubelet's own spelling) for
                      a signal the kubelet does not enforce.

                      Soft eviction is deliberately not modelled: it is a warning threshold that
                      does not reduce allocatable.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for evictionHard are ['memory.available','allocatableMemory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','containerfs.available','containerfs.inodesFree','pid.available']
                      rule: self.all(x, x in ['memory.available','allocatableMemory.available','nodefs.available','nodefs.inodesFree','imagefs.available','imagefs.inodesFree','containerfs.available','containerfs.inodesFree','pid.available'])
                  kubeReserved:
                    additionalProperties:
                      description: ReservedQuantity is a non-negative resource quantity,
                        such as "512Mi" or "200m".
                      maxLength: 32
                      pattern: ^[+]?(([0-9]+([.][0-9]*)?)|([.][0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE]([+]|-)?[0-9]{1,3}))?$
                      type: string
                    description: |-
                      KubeReserved is resources reserved for Kubernetes system daemons, matching
                      the kubelet's --kube-reserved.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for kubeReserved are ['cpu','memory','ephemeral-storage','pid']
                      rule: self.all(x, x=='cpu' || x=='memory' || x=='ephemeral-storage'
                        || x=='pid')
                  maxPods:
                    description: |-
                      MaxPods is the kubelet's maxPods setting: how many pods the node admits,
                      which Karpenter advertises as the node's pod capacity. Talos and k3s users
                      commonly change it. When omitted, the kubelet default of 110 is assumed.
                      Declaring it does not change how reservations are interpreted.
                    format: int32
                    maximum: 1024
                    minimum: 1
                    type: integer
                  systemReserved:
                    additionalProperties:
                      description: ReservedQuantity is a non-negative resource quantity,
                        such as "512Mi" or "200m".
                      maxLength: 32
                      pattern: ^[+]?(([0-9]+([.][0-9]*)?)|([.][0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE]([+]|-)?[0-9]{1,3}))?$
                      type: string
                    description: |-
                      SystemReserved is resources reserved for OS system daemons, matching the
                      kubelet's --system-reserved.
                    type: object
                    x-kubernetes-validations:
                    - message: valid keys for systemReserved are ['cpu','memory','ephemeral-storage','pid']
                      rule: self.all(x, x=='cpu' || x=='memory' || x=='ephemeral-storage'
                        || x=='pid')
                type: object
              labels:
                additionalProperties:
                  type: string
                type: object
              locations:
                items:
                  type: string
                minItems: 1
                type: array
              networkID:
                format: int64
                minimum: 1
                type: integer
              placementGroupIDs:
                description: |-
                  PlacementGroupIDs are existing spread placement groups (for example managed
                  in Terraform) to place servers in instead of provider-managed ones. Servers
                  go into the least-full listed group with room; the provider never creates,
                  deletes or adds groups to this list, and a launch fails when every listed
                  group is full (10 servers each). As with provider-managed groups, spread
                  holds only within each group. Cannot be combined with
                  placementGroupStrategy "none".
                items:
                  format: int64
                  minimum: 1
                  type: integer
                maxItems: 50
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              placementGroupStrategy:
                default: spread
                description: |-
                  PlacementGroupStrategy controls placement groups for provider-managed
                  placement. "spread" (the default) places each node pool's servers in spread
                  placement groups the provider creates and names after the cluster and node
                  pool. Hetzner admits at most 10 servers into one spread group, so a larger
                  pool rolls over to additional indexed groups (<name>-1, <name>-2, ...),
                  filling the least-full group first. The spread guarantee holds only WITHIN a
                  group: nodes in different groups may share a physical host, so anti-affinity
                  degrades gradually with pool size rather than all at once. "none" disables
                  placement groups.
                enum:
                - spread
                - none
                type: string
              sshKeyIDs:
                items:
                  format: int64
                  type: integer
                type: array
              userData:
                type: string
              userDataSecretRef:
                description: |-
                  UserDataSecretRef sources userData from a Secret instead of inline. When
                  set, it takes precedence over UserData. The Secret is read at server-create
                  time; its value never appears in the NodeClass spec, status, or git.
                properties:
                  key:
                    description: Key within the Secret's data holding the userData.
                    type: string
                  name:
                    description: Name of the Secret.
                    type: string
                  namespace:
                    description: 'Namespace of the Secret (required: HCloudNodeClass
                      is cluster-scoped).'
                    type: string
                required:
                - key
                - name
                - namespace
                type: object
              vmMemoryOverheadPercent:
                description: |-
                  VMMemoryOverheadPercent is the share of a server type's advertised memory
                  that the guest operating system never sees, as a decimal percentage such as
                  "7" or "6.5". Hetzner advertises the memory assigned to the VM; the kernel
                  reports less (firmware, kernel image, page tables, crash kernel), so a node's
                  registered capacity is smaller than the advertised size. Measured on
                  registered nodes the gap is about 6.9% on a 4 GB type, 5.4% on 8 GB, 4.7% on
                  16 GB and 4.4% on 32 GB: a fixed part plus a proportional part, so choose
                  the value that fits the smallest type the node class can launch (a larger
                  value only undersells the larger types).

                  When omitted, capacity is the advertised memory, as in earlier releases.
                maxLength: 5
                pattern: ^([0-9]|[1-4][0-9])([.][0-9]{1,2})?$
                type: string
            required:
            - imageSelector
            - locations
            - networkID
            type: object
            x-kubernetes-validations:
            - message: placementGroupIDs cannot be combined with placementGroupStrategy
                none
              rule: '!has(self.placementGroupIDs) || !has(self.placementGroupStrategy)
                || self.placementGroupStrategy != ''none'''
            - message: 'spec.bootstrap cannot be combined with imageSelector.family
                talos: a Talos image joins through its machine config, not cloud-init'
              rule: '!has(self.bootstrap) || self.imageSelector.family != ''talos'''
            - message: 'with spec.bootstrap, userData extends the rendered cloud-config
                and must itself be a cloud-config starting with #cloud-config'
              rule: '!has(self.bootstrap) || !has(self.userData) || self.userData.startsWith(''#cloud-config'')'
          status:
            properties:
              conditions:
                items:
                  description: Condition aliases the upstream type and adds additional
                    helper methods
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              resolvedImages:
                description: |-
                  ResolvedImages holds one image ID per hcloud architecture, resolved from
                  Spec.ImageSelector. The generation these answer is not stored alongside them: it is
                  read back from the ImagesReady condition's observedGeneration, which operatorpkg
                  stamps on every condition write and which has been part of the shipped CRD since
                  v1. A dedicated status field would be pruned to zero by any apiserver still serving
                  the CRD from an earlier release -- Helm never upgrades crds/ -- which would make
                  the carry-forward below silently inert on exactly the clusters it protects.
                items:
                  properties:
                    architecture:
                      description: |-
                        Architecture is the hcloud architecture spelling ("x86" or "arm"), not the
                        Kubernetes one ("amd64"/"arm64"). Instance-type selection compares this value
                        exactly, so an unrecognised spelling would make every architecture ineligible
                        while all conditions stayed green. Deliberately not a CRD enum: writer and reader
                        share the SDK constants so the drift cannot occur, while an enum would reject every
                        status update wholesale on clusters whose CRDs were applied at install and never
                        upgraded, the first time a third architecture appears.
                      type: string
                    imageID:
                      format: int64
                      type: integer
                  required:
                  - architecture
                  - imageID
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
